<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>SATOMI sedang offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --surface: rgba(19, 19, 23, 0.84);
        --cyan: #00f0ff;
        --cyan-soft: #7df4ff;
        --purple: #cf5cff;
        --text: #e5e1e7;
        --muted: #b9cacb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow-x: hidden;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.16), transparent 28rem),
          radial-gradient(circle at 85% 85%, rgba(207, 92, 255, 0.14), transparent 24rem),
          linear-gradient(180deg, #050508, var(--bg));
        color: var(--text);
        font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px);
        background-size: 56px 56px;
        opacity: 0.32;
        mask-image: linear-gradient(to bottom, transparent, black 20%, black 75%, transparent);
      }

      .card {
        position: relative;
        width: min(100%, 560px);
        overflow: hidden;
        border: 1px solid rgba(0, 240, 255, 0.28);
        border-radius: 28px;
        background: var(--surface);
        padding: 42px 24px;
        box-shadow: 0 0 54px rgba(0, 240, 255, 0.16), 0 28px 80px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(18px);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 50%;
        height: 1px;
        background: linear-gradient(90deg, rgba(0, 240, 255, 0.9), transparent);
      }

      .orb {
        position: relative;
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        margin: 0 auto 28px;
        border: 1px solid rgba(0, 240, 255, 0.5);
        border-radius: 999px;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.42), rgba(207, 92, 255, 0.34), rgba(0, 0, 0, 0.15));
        box-shadow: 0 0 52px rgba(0, 240, 255, 0.34);
      }

      .spark {
        width: 44px;
        height: 44px;
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
        background: #ffffff;
        filter: drop-shadow(0 0 18px var(--cyan));
      }

      h1 {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: clamp(2.1rem, 9vw, 4rem);
        line-height: 1.08;
        text-shadow: 0 0 24px rgba(0, 240, 255, 0.28);
      }

      p {
        margin: 18px auto 0;
        max-width: 440px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      button {
        min-height: 52px;
        width: min(100%, 320px);
        margin-top: 30px;
        border: 0;
        border-radius: 18px;
        background: var(--cyan);
        color: #020617;
        cursor: pointer;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        box-shadow: 0 0 28px rgba(0, 240, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <main class="card">
      <div class="orb" aria-hidden="true">
        <div class="spark"></div>
      </div>
      <h1>SATOMI sedang offline</h1>
      <p>
        Koneksi internet tidak tersedia. Beberapa data terakhir mungkin masih
        bisa dilihat, tapi sinkronisasi membutuhkan koneksi.
      </p>
      <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
