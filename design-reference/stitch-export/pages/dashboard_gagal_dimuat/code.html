<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SATOMI - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@500&amp;family=Manrope:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#320047",
                        "on-tertiary-fixed": "#1d1639",
                        "secondary-fixed": "#f8d8ff",
                        "on-tertiary-container": "#615a81",
                        "on-surface": "#e5e1e7",
                        "on-error": "#690005",
                        "primary": "#dbfcff",
                        "on-primary-fixed-variant": "#004f54",
                        "inverse-on-surface": "#303034",
                        "tertiary-fixed": "#e6deff",
                        "inverse-surface": "#e5e1e7",
                        "error-container": "#93000a",
                        "tertiary-fixed-dim": "#cac1ed",
                        "on-secondary-container": "#480063",
                        "surface-container-low": "#1b1b1f",
                        "surface-bright": "#39393d",
                        "background": "#131317",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#353439",
                        "outline": "#849495",
                        "on-secondary": "#520071",
                        "surface-variant": "#353439",
                        "primary-container": "#00f0ff",
                        "tertiary-container": "#ddd4ff",
                        "on-primary": "#00363a",
                        "surface-container-lowest": "#0e0e12",
                        "error": "#ffb4ab",
                        "primary-fixed": "#7df4ff",
                        "on-primary-fixed": "#002022",
                        "inverse-primary": "#006970",
                        "surface-container-high": "#2a292e",
                        "secondary": "#ecb2ff",
                        "on-primary-container": "#006970",
                        "tertiary": "#faf4ff",
                        "surface": "#131317",
                        "surface-tint": "#00dbe9",
                        "on-secondary-fixed-variant": "#74009f",
                        "on-background": "#e5e1e7",
                        "primary-fixed-dim": "#00dbe9",
                        "secondary-fixed-dim": "#ecb2ff",
                        "secondary-container": "#cf5cff",
                        "surface-dim": "#131317",
                        "outline-variant": "#3b494b",
                        "on-tertiary-fixed-variant": "#484267",
                        "surface-container": "#1f1f23",
                        "on-tertiary": "#322b4f",
                        "on-surface-variant": "#b9cacb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-max": "1280px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-sm": ["JetBrains Mono"],
                        "body-md": ["Manrope"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["40px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Cyber-Premium Glows */
        .glow-red {
            box-shadow: 0 0 40px rgba(255, 180, 171, 0.2);
        }
        
        /* Background gradient */
        body {
            background: radial-gradient(circle at center, #1b0f1a 0%, #050508 100%);
            background-color: #050508;
            min-height: 100vh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-md text-body-md flex items-center justify-center relative overflow-hidden">
<!-- Ambient Glows -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-error/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
<!-- Main Canvas -->
<main class="relative z-10 w-full max-w-lg px-margin-mobile md:px-0">
<!-- Error Card (Glassmorphism) -->
<div class="bg-surface/40 backdrop-blur-[24px] border border-error/30 rounded-2xl p-8 md:p-12 text-center glow-red relative overflow-hidden">
<!-- Highlight streak on top left -->
<div class="absolute top-0 left-0 w-32 h-[1px] bg-gradient-to-r from-error to-transparent"></div>
<div class="absolute top-0 left-0 w-[1px] h-32 bg-gradient-to-b from-error to-transparent"></div>
<!-- Icon -->
<div class="mb-8 inline-flex items-center justify-center w-24 h-24 rounded-full bg-error-container/20 border border-error/40 shadow-[0_0_30px_rgba(255,180,171,0.3)]">
<span class="material-symbols-outlined text-error text-[48px]" data-icon="gpp_bad" data-weight="fill">gpp_bad</span>
</div>
<!-- Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-error mb-4 tracking-tight drop-shadow-[0_0_8px_rgba(255,180,171,0.4)]">
                Ringkasan gagal dimuat
            </h1>
<p class="text-on-surface-variant font-body-md text-body-md mb-10 max-w-xs mx-auto leading-relaxed">
                Coba muat ulang. Data transaksi kamu tetap aman.
            </p>
<!-- Actions -->
<div class="flex flex-col gap-4">
<button class="w-full bg-error text-on-error font-label-sm text-label-sm uppercase py-4 rounded-lg tracking-widest hover:shadow-[0_0_20px_rgba(255,180,171,0.5)] transition-all active:scale-[0.98]">
                    Muat Ulang
                </button>
<button class="w-full bg-transparent border border-error/50 text-error font-label-sm text-label-sm uppercase py-4 rounded-lg tracking-widest hover:bg-error/10 transition-all active:scale-[0.98]">
                    Buka Riwayat
                </button>
</div>
</div>
</main>
</body></html>
