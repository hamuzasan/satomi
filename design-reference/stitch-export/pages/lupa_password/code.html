<style>
        body {
            background-color: #050508;
            color: #e5e1e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .glass-card {
            background: rgba(19, 19, 23, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: auto;
            bottom: auto;
            width: 30%;
            height: 1px;
            background: linear-gradient(90deg, rgba(0, 219, 233, 0.8), transparent);
            border-top-left-radius: 0.75rem;
        }

        .glow-primary {
            box-shadow: 0 0 30px rgba(0, 219, 233, 0.2);
        }

        .glow-active {
            box-shadow: 0 0 40px rgba(0, 219, 233, 0.4);
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: -1;
            pointer-events: none;
        }

        .ambient-light {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(0, 219, 233, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Input styling overrides */
        input:focus {
            outline: none;
            border-color: #00dbe9;
            box-shadow: inset 0 0 10px rgba(0, 219, 233, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-body-md text-body-md antialiased">
<div class="bg-grid"></div>
<div class="ambient-light"></div>
<main class="flex-1 flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop w-full max-w-container-max mx-auto relative z-10">
<!-- Brand / Header -->
<div class="mb-12 text-center">
<h1 class="font-display-lg text-headline-lg-mobile md:text-headline-lg tracking-tighter text-primary drop-shadow-[0_0_8px_rgba(0,219,233,0.4)]">SATOMI</h1>
</div>
<!-- Form Container -->
<div class="glass-card rounded-xl p-8 md:p-12 w-full max-w-md glow-primary transition-all duration-500" id="reset-form-container">
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Reset password</h2>
<p class="text-on-surface-variant">Masukkan email kamu, kami akan kirim link reset.</p>
</div>
<form class="space-y-6" id="reset-form" onsubmit="event.preventDefault(); showSuccessState();">
<div class="space-y-2 relative">
<label class="font-label-sm text-label-sm text-primary uppercase block" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full bg-black/30 border border-white/10 rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline-variant transition-all duration-300" id="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-lg font-label-sm text-label-sm uppercase tracking-wider hover:shadow-[0_0_20px_rgba(0,219,233,0.6)] transition-all duration-300 active:scale-95 flex items-center justify-center gap-2" type="submit">
<span>Kirim Link Reset</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<a class="font-label-sm text-label-sm text-primary uppercase hover:text-primary-fixed transition-colors inline-flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Kembali ke Login
                </a>
</div>
</div>
<!-- Success State Container (Hidden by default) -->
<div class="glass-card rounded-xl p-8 md:p-12 w-full max-w-md glow-active text-center hidden opacity-0 transition-all duration-500 scale-95" id="success-container">
<div class="w-20 h-20 mx-auto bg-primary-container/20 rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(0,219,233,0.3)]">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-4">Email terkirim</h2>
<p class="text-on-surface-variant mb-8">Cek inbox atau folder spam untuk melanjutkan reset password.</p>
<button class="w-full bg-transparent border-2 border-primary/50 text-on-surface py-3 px-6 rounded-lg font-label-sm text-label-sm uppercase tracking-wider hover:border-primary hover:bg-primary/10 transition-all duration-300" onclick="resetForm()">
                Kembali
            </button>
</div>
</main>
<script>
        function showSuccessState() {
            const formContainer = document.getElementById('reset-form-container');
            const successContainer = document.getElementById('success-container');
            
            // Fade out form
            formContainer.style.opacity = '0';
            formContainer.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                formContainer.classList.add('hidden');
                
                // Show success state
                successContainer.classList.remove('hidden');
                // Trigger reflow
                void successContainer.offsetWidth;
                
                successContainer.style.opacity = '1';
                successContainer.style.transform = 'scale(1)';
            }, 500);
        }

        function resetForm() {
            const formContainer = document.getElementById('reset-form-container');
            const successContainer = document.getElementById('success-container');
            const form = document.getElementById('reset-form');
            
            // Fade out success
            successContainer.style.opacity = '0';
            successContainer.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                successContainer.classList.add('hidden');
                
                // Reset and show form
                form.reset();
                formContainer.classList.remove('hidden');
                // Trigger reflow
                void formContainer.offsetWidth;
                
                formContainer.style.opacity = '1';
                formContainer.style.transform = 'scale(1)';
            }, 500);
        }
    </script>
</body></html>
